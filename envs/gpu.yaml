# Linux x86_64 with an NVIDIA driver supporting CUDA 12.
# The JAX CUDA extra is necessary for MrVI; CUDA PyTorch alone is insufficient.
name: scrna-benchmark-gpu
channels:
  - conda-forge
dependencies:
  - python=3.12.2
  - pip
  - libgcc-ng
  - libstdcxx-ng
  - pip:
      - snakemake==9.11.5
      - scvi-tools==1.3.0
      - scanpy==1.11.0
      - scib==1.1.7
      - anndata==0.11.3
      - numpy==2.1.3
      - pandas==2.2.3
      - scipy==1.15.2
      - torch==2.6.0
      - lightning==2.5.0.post0
      - torchmetrics==1.6.2
      - jax[cuda12]==0.4.35
      # JAX 0.4.35's CUDA extra explicitly requires jaxlib 0.4.34.
      - jaxlib==0.4.34
      - jax-cuda12-plugin==0.4.35
      - nvidia-cuda-nvcc-cu12==12.4.131
      - flax==0.10.2
      - optax==0.2.4
      - numpyro==0.16.1
      - chex==0.1.88
      - orbax-checkpoint==0.6.4
      - igraph==0.11.8
      - leidenalg==0.10.2
      - scikit-misc==0.5.1
      - scikit-learn==1.5.2
      - matplotlib==3.10.1
      - PyYAML==6.0.2
      - openpyxl==3.1.5
      - h5py==3.13.0
      - numba==0.61.0
